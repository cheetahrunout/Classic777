<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classic 777</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;700&family=Limelight&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Shared gradients used by the reel symbols and the lever -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-seven" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset=".55" stop-color="#d10f1b"/>
      <stop offset="1" stop-color="#7d0610"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset=".45" stop-color="#e9b83a"/>
      <stop offset="1" stop-color="#8a5a12"/>
    </linearGradient>
    <radialGradient id="g-cherry" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset=".4" stop-color="#e01226"/>
      <stop offset="1" stop-color="#6d0410"/>
    </radialGradient>
    <linearGradient id="g-chrome-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6268"/>
      <stop offset=".25" stop-color="#f4f6f8"/>
      <stop offset=".5" stop-color="#a9aeb4"/>
      <stop offset=".75" stop-color="#e6e9ec"/>
      <stop offset="1" stop-color="#4b5056"/>
    </linearGradient>
    <linearGradient id="g-chrome-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset=".45" stop-color="#9ba1a7"/>
      <stop offset=".55" stop-color="#d9dde1"/>
      <stop offset="1" stop-color="#555a60"/>
    </linearGradient>
    <radialGradient id="g-hub" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#c3c8cd"/>
      <stop offset=".8" stop-color="#5e646a"/>
      <stop offset="1" stop-color="#2e3236"/>
    </radialGradient>
    <radialGradient id="g-ball" cx=".36" cy=".3" r=".78">
      <stop offset="0" stop-color="#ff9c8f"/>
      <stop offset=".3" stop-color="#ee2a2a"/>
      <stop offset=".75" stop-color="#9a0a12"/>
      <stop offset="1" stop-color="#4a0308"/>
    </radialGradient>
    <filter id="vblur" x="0" y="-5%" width="100%" height="110%">
      <feGaussianBlur stdDeviation="0 7"/>
    </filter>
  </defs>
</svg>

<main id="stage">
  <div id="machine" class="machine">
    <header class="topper">
      <div class="bulbs" id="bulbs" aria-hidden="true"></div>
      <div class="marquee">
        <span class="marquee-small">Classic</span>
        <h1>7<span>7</span>7</h1>
        <span class="marquee-small">Jackpot</span>
      </div>
    </header>

    <section class="cabinet">
      <table class="paytable" aria-label="Pay table">
        <thead>
          <tr><th scope="col">Pays</th><th scope="col" data-col="1">1 Coin</th><th scope="col" data-col="2">2 Coins</th><th scope="col" data-col="3">3 Coins</th></tr>
        </thead>
        <tbody id="paytable-body"></tbody>
      </table>

      <div class="reel-bezel">
        <div class="reels" id="reels"></div>
        <div class="payline" aria-hidden="true"><i></i><i></i></div>
        <div class="glass" aria-hidden="true"></div>
      </div>

      <div class="leds">
        <div class="led"><span class="led-label">Credits</span><output id="credits" class="led-digits">100</output></div>
        <div class="led"><span class="led-label">Bet</span><output id="bet" class="led-digits">1</output></div>
        <div class="led"><span class="led-label">Winner Paid</span><output id="win" class="led-digits">0</output></div>
      </div>
      <div class="ticker" aria-live="polite"><span id="message">PULL THE HANDLE</span></div>

      <div class="controls">
        <button id="btn-sound" class="btn btn-chrome" type="button" aria-pressed="true" title="Sound on/off">Sound<br>On</button>
        <button id="btn-bet" class="btn btn-amber" type="button">Bet<br>One</button>
        <button id="btn-max" class="btn btn-amber" type="button">Max<br>Bet</button>
        <button id="btn-spin" class="btn btn-spin" type="button">Spin</button>
      </div>

      <div class="plate">Model 777-C · Pays on the center line · Space to spin</div>

      <div class="tray" id="tray" aria-hidden="true"><div class="tray-lip"></div></div>
      <button id="btn-refill" class="btn btn-refill" type="button" hidden>Add 100 Credits</button>
    </section>

    <svg id="lever" class="lever" viewBox="0 0 150 540" width="150" height="540" role="slider"
         aria-label="Slot machine handle. Drag down to spin." aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" tabindex="0">
      <g id="lever-housing">
        <rect x="6" y="196" width="84" height="108" rx="16" fill="url(#g-chrome-v)" stroke="#3b3f44" stroke-width="2"/>
        <rect x="16" y="208" width="64" height="84" rx="10" fill="#1d1f22" opacity=".85"/>
        <circle cx="20" cy="210" r="4" fill="url(#g-hub)"/>
        <circle cx="20" cy="290" r="4" fill="url(#g-hub)"/>
      </g>
      <circle cx="62" cy="250" r="30" fill="url(#g-hub)" stroke="#2a2d31" stroke-width="2"/>
      <circle cx="62" cy="250" r="17" fill="#2a2d31"/>
      <polygon id="lever-rod" fill="url(#g-chrome-h)" stroke="#3a3e43" stroke-width="1"/>
      <ellipse id="lever-collar" fill="url(#g-chrome-h)" stroke="#3a3e43" stroke-width="1"/>
      <circle id="lever-hubcap" cx="62" cy="250" r="11" fill="url(#g-hub)"/>
      <g id="lever-ball">
        <circle id="lever-ball-shape" fill="url(#g-ball)" stroke="#3d0207" stroke-width="1.5"/>
        <ellipse id="lever-ball-shine" fill="#fff" opacity=".75"/>
      </g>
      <circle id="lever-grab" fill="transparent"/>
    </svg>
  </div>
</main>

<script src="game.js"></script>
</body>
</html>
