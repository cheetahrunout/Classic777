<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classic 777</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;700&family=Limelight&family=Share+Tech+Mono&family=Yellowtail&display=swap">
<!-- The player's own casino theme; style.css keeps a fallback for when the casino is unreachable. -->
<link rel="stylesheet" href="https://casino.grovestreet.zip/theme.css">
<!-- The casino bar: balance, top up, players and chat (section 7). -->
<script src="https://casino.grovestreet.zip/bar.js" data-game="classic777"></script>
</head>
<body>
<!-- Shared gradients used by the reel symbols and the lever -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-seven" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a4e"/>
      <stop offset=".55" stop-color="#d10f1b"/>
      <stop offset="1" stop-color="#7d0610"/>
    </linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset=".45" stop-color="#e9b83a"/>
      <stop offset="1" stop-color="#8a5a12"/>
    </linearGradient>
    <radialGradient id="g-cherry" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset=".4" stop-color="#e01226"/>
      <stop offset="1" stop-color="#6d0410"/>
    </radialGradient>
    <linearGradient id="g-chrome-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6268"/>
      <stop offset=".25" stop-color="#f4f6f8"/>
      <stop offset=".5" stop-color="#a9aeb4"/>
      <stop offset=".75" stop-color="#e6e9ec"/>
      <stop offset="1" stop-color="#4b5056"/>
    </linearGradient>
    <linearGradient id="g-chrome-v" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfd"/>
      <stop offset=".45" stop-color="#9ba1a7"/>
      <stop offset=".55" stop-color="#d9dde1"/>
      <stop offset="1" stop-color="#555a60"/>
    </linearGradient>
    <radialGradient id="g-hub" cx=".38" cy=".32" r=".8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#c3c8cd"/>
      <stop offset=".8" stop-color="#5e646a"/>
      <stop offset="1" stop-color="#2e3236"/>
    </radialGradient>
    <radialGradient id="g-ball" cx=".36" cy=".3" r=".78">
      <stop offset="0" stop-color="#ff9c8f"/>
      <stop offset=".3" stop-color="#ee2a2a"/>
      <stop offset=".75" stop-color="#9a0a12"/>
      <stop offset="1" stop-color="#4a0308"/>
    </radialGradient>
    <filter id="vblur" x="0" y="-5%" width="100%" height="110%">
      <feGaussianBlur stdDeviation="0 7"/>
    </filter>
  </defs>
</svg>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
