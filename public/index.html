<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classic 777</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@500;700&family=Limelight&family=Share+Tech+Mono&display=swap">
<link rel="stylesheet" href="/style.css">
<script src="https://casino.grovestreet.zip/bar.js" data-game="classic777"></script>
</head>
<body>
<main id="stage">
  <div id="machine" class="machine">
    <header class="topper">
      <div class="bulbs" id="bulbs"></div>
      <div class="marquee">
        <span class="marquee-small">Classic</span>
        <h1>7<span>7</span>7</h1>
        <span class="marquee-small">Jackpot</span>
      </div>
    </header>
    <section class="cabinet">
      <div class="reel-bezel">
        <div class="reels" id="reels">
          <div class="reel"><div class="strip" id="strip0"></div></div>
          <div class="reel"><div class="strip" id="strip1"></div></div>
          <div class="reel"><div class="strip" id="strip2"></div></div>
        </div>
        <div class="payline"><i></i><i></i></div>
      </div>
      <div class="leds">
        <div class="led"><span class="led-label">Status</span><output id="status" class="led-digits">...</output></div>
        <div class="led"><span class="led-label">Bet</span><output id="bet" class="led-digits">20</output></div>
        <div class="led"><span class="led-label">Win</span><output id="win" class="led-digits">0</output></div>
      </div>
      <div class="ticker"><span id="message">PULL TO SPIN</span></div>
      <div class="controls">
        <button id="btn-spin" class="btn btn-spin" type="button">SPIN</button>
      </div>
    </section>
  </div>
</main>
<script src="/client.js"></script>
</body>
</html>
